# AVHSOL knowledge stack: Neo4j (bitemporal trace graph) + Qdrant (vector store).
# Everything binds to 127.0.0.1 only. Credentials come from ./.env (generated by scripts/stack.sh).
# Images are pinned by digest; bump them deliberately.
name: avhsol-stack

x-hardening: &hardening
  user: "${AVHSOL_UID:?run scripts/stack.sh up}:${AVHSOL_GID:?run scripts/stack.sh up}"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  neo4j:
    <<: *hardening
    image: neo4j:5-community@sha256:362542416de6c09a971484d1893878016cc3b5cdec166e54b1c824a220ecd6b9
    ports:
      - "127.0.0.1:7474:7474"   # browser (for the security team to explore the graph)
      - "127.0.0.1:7687:7687"   # bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?run scripts/stack.sh up}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_server_default__listen__address: 0.0.0.0
    volumes:
      - ./data/neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  qdrant:
    <<: *hardening
    image: qdrant/qdrant@sha256:0bd98fa7977f1e75694779359ca4e212822e5a71334e28421182f72f209d5286
    # Runs as the host user with no capabilities, so everything it writes (including its init marker,
    # which it creates in the working directory) must live on the writable volume.
    working_dir: /qdrant/storage
    entrypoint: ["/qdrant/qdrant"]
    ports:
      - "127.0.0.1:6333:6333"   # REST
    environment:
      QDRANT__SERVICE__HOST: 0.0.0.0
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:?run scripts/stack.sh up}"
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage/data
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---- optional observability: scripts/stack.sh up --observability ----------------------------------------------------
  # Both run on the host network so they can reach the loopback-only API, and both bind to 127.0.0.1 only.
  prometheus:
    <<: *hardening
    profiles: [observability]
    image: prom/prometheus@sha256:565ee86501224ebbb98fc10b332fa54440b100469924003359edf49cbce374bd
    network_mode: host
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ./data/prometheus:/prometheus

  grafana:
    <<: *hardening
    profiles: [observability]
    image: grafana/grafana@sha256:fa801ab6e1ae035135309580891e09f7eb94d1abdbd2106bdc288030b028158c
    network_mode: host
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3001"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?run scripts/stack.sh up --observability}"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/avhsol.json
      GF_PATHS_DATA: /var/lib/grafana/data-store
      GF_PATHS_PLUGINS: /var/lib/grafana/data-store/plugins
      GF_PATHS_LOGS: /tmp/grafana-logs
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana/data-store

# Scrapes the AVHSOL API's /metrics (host, sandbox, guard, runs, intel). The bearer token is a viewer-role token written to
# ./token by `scripts/stack.sh up --observability` (mode 600, git-ignored); it can read metrics and nothing else.
global:
  scrape_interval: 5s
  evaluation_interval: 15s
scrape_configs:
  - job_name: avhsol
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/token
    static_configs:
      - targets: ["127.0.0.1:8787"]
